<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entrar · TimEver</title>
  <link rel="icon" type="image/svg+xml" href="/img/timever-icone.svg">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0E1015">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TimEver">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/acesso.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body>
  <div class="manchas" aria-hidden="true">
    <span class="mancha mancha-1"></span><span class="mancha mancha-2"></span>
    <span class="mancha mancha-3"></span><span class="mancha mancha-4"></span>
  </div>

  <main class="vidro">
    <div class="marca">
      <img class="marca-logo" src="/img/timever-icone.svg" alt="" width="56" height="56">
      <span class="marca-nome">TimEver</span>
    </div>

    <!-- ==================== ENTRAR ==================== -->
    <section id="telaEntrar" aria-labelledby="entrarTitulo">
      <h1 id="entrarTitulo">Login</h1>
      <p class="sub">Seu tempo, sob controle</p>

      <form class="formulario" id="formEntrar" novalidate>
        <p class="mensagem" id="mensagemEntrar" role="status" aria-live="polite"></p>

        <label class="campo">
          <span class="so-leitor">E-mail</span>
          <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="username" maxlength="254" required>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c.8-4.2 4-6.5 8-6.5s7.2 2.3 8 6.5"></path></svg>
        </label>

        <label class="campo">
          <span class="so-leitor">Senha</span>
          <input type="password" id="senha" name="senha" placeholder="Senha" autocomplete="current-password" required>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="M10.7 12.3L20 3"></path><path d="M16.5 6.5l2.5 2.5"></path><path d="M14 9l2 2"></path></svg>
        </label>

        <div class="opcoes">
          <label class="lembrar"><input type="checkbox" id="lembrar"> Lembrar de mim</label>
          <button class="link" id="irEsqueci" type="button">Esqueci a senha</button>
        </div>

        <button class="botao-pilula" id="btnEntrar" type="submit">Entrar</button>
        <p class="rodape">Acesso só por convite do administrador.</p>
      </form>
    </section>

    <!-- ==================== ESQUECI A SENHA ==================== -->
    <section id="telaEsqueci" aria-labelledby="esqueciTitulo" hidden>
      <h1 id="esqueciTitulo">Esqueci a senha</h1>
      <p class="sub">Mandamos um link para você definir uma senha nova.</p>

      <form class="formulario" id="formEsqueci" novalidate>
        <p class="mensagem" id="mensagemEsqueci" role="status" aria-live="polite"></p>

        <label class="campo">
          <span class="so-leitor">E-mail</span>
          <input type="email" id="emailEsqueci" placeholder="E-mail" autocomplete="username" maxlength="254" required>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M4 7l8 6 8-6"></path></svg>
        </label>

        <button class="botao-pilula" id="btnEsqueci" type="submit">Enviar link</button>
        <p class="rodape"><button class="link" id="voltarEntrar" type="button">Voltar ao login</button></p>
      </form>
    </section>
  </main>
</body>
</html>
